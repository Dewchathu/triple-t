name: triple_t
description: "Tac tic toe Game"

publish_to: 'none'


version: 1.0.0+8


environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  page_transition: ^2.1.0
  loading_indicator: ^3.1.1
  flame: ^1.17.0
  flame_audio: ^2.10.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  in_app_update: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/


